packages:
  - "."
  - "packages/*"
  - "!packages/ui-prototype"

# Vị trí cấu hình của pnpm 11+: bản này không còn đọc nhiều thiết lập từ package.json/.npmrc.
# nodeLinker: hoisted là yêu cầu của bước kiểm tra hệ thống trong Electron Forge.
# Forge gọi `pnpm config get node-linker`; cách bố trí node_modules bằng symlink của isolated
# không tương thích với đóng gói Electron và các module native, nên `pnpm dev` sẽ bị chặn.
# allowBuilds cho phép hoặc từ chối chạy script build/postinstall của từng dependency.
# electron, better-sqlite3 và esbuild cần build nên đặt true. Script postinstall của
# core-js và es5-ext không cần cho chức năng, nên đặt false để tránh chạy script bên thứ ba
# và tránh ERR_PNPM_IGNORED_BUILDS (hai gói này được epubjs kéo theo).
# fs-xattr/macos-alias là dependency native của maker-dmg → appdmg; chúng chạy trong
# Node hệ thống của Forge CLI để tạo alias /Applications và thuộc tính mở rộng trong DMG.
# blockExoticSubdeps: false cho phép dependency lấy từ Git như @electron/node-gyp.
nodeLinker: hoisted
blockExoticSubdeps: false
allowBuilds:
  electron: true
  electron-winstaller: true
  better-sqlite3: true
  esbuild: true
  core-js: false
  es5-ext: false
  "@swc/core": true
  fs-xattr: true
  macos-alias: true
patchedDependencies:
  pdfjs-dist: patches/pdfjs-dist.patch
minimumReleaseAgeExclude:
  - "@ai-sdk/deepseek@3.0.51"
  - "@ai-sdk/provider-utils@5.0.46"
  - "@ai-sdk/provider@4.0.18"
  - "@ai-sdk/anthropic@4.0.61"
  - "@ai-sdk/gateway@4.0.90"
  - "@ai-sdk/google@4.0.78"
  - "@ai-sdk/mcp@2.0.56"
  - "@ai-sdk/openai-compatible@3.0.54"
  - "@ai-sdk/openai@4.0.73"
  - "@ai-sdk/react@4.0.115"
  - ai@7.0.112
